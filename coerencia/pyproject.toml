[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coerencia"
version = "1.1.0"
description = "Contradições narrativas com a API do Claude, com leitura incremental por capítulo"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1", "anthropic>=1.0"]

[tool.setuptools]
packages = ["coerencia"]
