[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coerencia"
version = "2.0.0"
description = "Contradições narrativas por IA: leitura incremental por cena (1.x) e leitura global (2.0)"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1", "anthropic>=1.0"]

[tool.setuptools]
packages = ["coerencia", "coerencia2"]
