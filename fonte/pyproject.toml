[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fonte-revisor"
version = "1.3.0"
description = "Triagem editorial local de manuscritos em português"
requires-python = ">=3.10,<3.14"
dependencies = ["python-docx==1.2.0", "spacy==3.8.16"]

[project.scripts]
fonte = "fonte.cli:main"

[tool.setuptools.packages.find]
include = ["fonte*"]

[tool.setuptools.package-data]
fonte = ["data/*.gz", "data/*.json", "data/*.txt", "data/*.md"]
