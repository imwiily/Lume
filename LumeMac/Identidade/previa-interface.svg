, Liberation Sans, sans-serif" font-size="11" fill="#5D695F" font-weight="normal">›  Detalhes da análise</text><rect x="645" y="611" width="716" height="1" rx="0" fill="#DDDCD0"/><text x="645" y="649" font-family="Georgia, Liberation Serif, serif" font-size="25" fill="#233D34" font-weight="normal">Como você avalia este trecho?</text><rect x="645" y="674" width="350" height="69" rx="10" fill="#E8EDE4" stroke="#5D695F"/><circle cx="668" cy="700" r="7" fill="#5D695F" stroke="#5D695F"/><text x="688" y="701" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#233D34" font-weight="bold">Pendente</text><text x="688" y="722" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#5D695F" font-weight="normal">Voltar a este trecho depois</text><rect x="1009" y="674" width="352" height="69" rx="10" fill="#FFFCF6" stroke="#DDDCD0"/><circle cx="1032" cy="700" r="7" fill="none" stroke="#A0443D"/><text x="1052" y="701" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#233D34" font-weight="bold">Erro confirmado</text><text x="1052" y="722" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#5D695F" font-weight="normal">Há uma correção a fazer</text><rect x="645" y="756" width="350" height="69" rx="10" fill="#FFFCF6" stroke="#DDDCD0"/><circle cx="668" cy="782" r="7" fill="none" stroke="#44617B"/><text x="688" y="783" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#233D34" font-weight="bold">Estilo do autor</text><text x="688" y="804" font-family="Arial, Liberation Sans, sans-serif" font-size="10" fill="#5D695F" font-weight="normal">Preservar a escolha narrativa</text><rect x="1009" y="756" width="352" height="69" rx="10" fill="#FFFCF6" stroke="#DDDCD0"/><circle cx="1032" cy="782" r="7" fill="none" stroke="#245548"/><text x="1052" y="783" font-family="Arial, Liberation Sans, sans-serif" font-size="12" fill="#233D34" font-weight="bold">Falso positivo</text><text x="1052" y="804" font-famil